name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SQLITE_PATH: /tmp/genos-ci.sqlite3
      SQLITE_BUSY_TIMEOUT_MS: "5000"
      NEXT_PUBLIC_FIREBASE_API_KEY: ci-firebase-key
      NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ci-genos.firebaseapp.com
      NEXT_PUBLIC_FIREBASE_PROJECT_ID: ci-genos
      NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: "123456789"
      NEXT_PUBLIC_FIREBASE_APP_ID: 1:123456789:web:ci
      FIREBASE_AUTH_EMULATOR_HOST: 127.0.0.1:9099
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=low
      - run: npm run config:check
      - run: npm run db:migrate
      - run: npm run db:verify
        env:
          ALLOW_DATABASE_INTEGRATION_TESTS: "true"
      - run: npm run db:verify-runtime
        env:
          ALLOW_DATABASE_INTEGRATION_TESTS: "true"
      - run: npm run lint -- --max-warnings=0
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
