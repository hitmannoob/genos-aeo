services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: genos
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d genos"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - genos-postgres-data:/var/lib/postgresql/data

volumes:
  genos-postgres-data:
